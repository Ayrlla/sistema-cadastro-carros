<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Tela de Login</title>
</head>
<body>
    
    
    <div class="container">
        <form class="login-box">
            <h2>Login</h2>

            <div class="input-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu Usuário" required>
            
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua Senha" required>
            

                <button type="submit">Entrar</button>
            </div>
        </form>
    
     <div class="helper">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer">
            <input type="checkbox" onclick="togglePwd()" aria-label="Mostrar senha"> Mostrar senha
          </label>
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button class="btn btn-primary" type="submit">Entrar</button>
        <button class="btn btn-ghost" type="button" onclick="window.location.href='cadastro-usuario.html'">Criar conta</button>
        <button class="btn btn-secondary" type="button" onclick="window.location.href='cadastro-carros.html'">
  Ir para Cadastro de Carros
</button>


       
  <footer class="footer">© 2025 - <strong>Cadastramento de Carros</strong></footer>

  <script>
    function togglePwd() {
      const el = document.getElementById('senha');
      el.type = (el.type === 'password') ? 'text' : 'password';
    }
  </script>
</body>
</html>
